<!doctype html>
<html lang="it" data-screen="menu" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sburdle</title>
<meta name="description" content="Sburdle, il Wordle in italiano. Indovina la parola di 4, 5, 6 o 7 lettere in 6 tentativi.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sburdle">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="sburdle-apple-touch-icon.png">
<link rel="icon" type="image/png" href="sburdle-favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#0a0a0a; --muted:#6b6b6b;
  --line:#e2e2e2; --tile-edge:#d6d6d6; --wire:#0a0a0a; --hud:#0a0a0a; --on-hud:#ffffff;
  --key:#f1f1f1; --key-hover:#e5e5e5; --sw-off:#cfcfcf;
  --correct:#0a0a0a; --correct-ink:#ffffff; --present:#8f8f8f; --present-ink:#000000;
  --absent:#ececec; --absent-ink:#9a9a9a;
  --horse-c:#000; --horse-o:.13; --hs:max(108vh,68vw); --hx:50%;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 12px 32px rgba(0,0,0,.12);
}
:root[data-theme=dark]{
  --bg:#000000; --panel:#0a0a0a; --ink:#f5f5f3; --muted:#8c8c8c;
  --line:#242424; --tile-edge:#2e2e2e; --wire:#f5f5f3; --hud:#f5f5f3; --on-hud:#000000;
  --key:#141414; --key-hover:#202020; --sw-off:#363636;
  --correct:#f5f5f3; --correct-ink:#000000; --present:#6f6f6f; --present-ink:#ffffff;
  --absent:#151515; --absent-ink:#7a7a7a;
  --horse-c:#ffffff; --horse-o:.27;
  --shadow:0 12px 32px rgba(0,0,0,.7);
}
/* il cavallo cambia peso tra menu e partita: più presente nel menu, più discreto sotto il tabellone */
:root[data-screen=game]{--horse-o:.09;--hs:max(100vh,64vw)}
:root[data-theme=dark][data-screen=game]{--horse-o:.1}
/* momento: quando vinci il cavallo si accende */
:root.won{--horse-o:.34}
:root[data-theme=dark].won{--horse-o:.42}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100dvh;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  transition:background .3s;
}
#horse{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:var(--horse-c);opacity:var(--horse-o);
  -webkit-mask-image:var(--horse-img);mask-image:var(--horse-img);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:var(--hs) var(--hs);mask-size:var(--hs) var(--hs);
  -webkit-mask-position:var(--hx) 50%;mask-position:var(--hx) 50%;
  transition:opacity 1.3s ease,-webkit-mask-size 1.4s ease,mask-size 1.4s ease,-webkit-mask-position 1.4s ease,mask-position 1.4s ease;
  animation:horse-in 2s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes horse-in{from{opacity:0;transform:scale(1.05)}}
@media (max-width:640px){:root{--hx:50%;--hs:max(74vh,118vw)}:root[data-screen=game]{--hs:max(66vh,112vw)}}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* intestazione */
header{width:100%;max-width:520px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--mono);font-weight:600;font-size:clamp(20px,5.6vw,24px);letter-spacing:-.02em;line-height:1}
.ttl{text-align:center}
.ttl small{display:block;margin-top:5px;font-family:var(--mono);font-size:12px;line-height:1;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.bar{display:flex;gap:2px}
.bar.r{justify-content:flex-end}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink);transition:background .15s,transform .06s}
.ib:hover{background:var(--key)}
.ib:active{transform:scale(.94)}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ib.pulse{animation:pulse 1.4s ease-in-out 3}
@keyframes pulse{50%{background:var(--hud);color:var(--on-hud)}}

main{flex:1;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;padding:14px 8px 12px}

/* tabellone: tre toni, nessun colore — pieno = al posto giusto, grigio = c'è ma altrove, spento = non c'è */
#board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;margin:auto 0;container-type:inline-size;
  width:min(92vw,calc(var(--cols) * 64px + (var(--cols) - 1) * 6px),calc((100dvh - 300px) * var(--cols) / 6))}
.row{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:6px}
.tile{
  aspect-ratio:1;display:grid;place-items:center;border-radius:3px;
  background:transparent;border:1.5px solid var(--tile-edge);
  font-family:var(--mono);font-weight:600;font-size:clamp(24px,8vw,32px);line-height:1;text-transform:uppercase;user-select:none;
}
@supports (width:1cqw){.cq .tile{font-size:calc(100cqw / var(--cols) * var(--k,.46))}}
.tile.filled{border-color:var(--wire);animation:pop .12s ease-out}
.tile.correct{background:var(--correct);border-color:var(--correct);color:var(--correct-ink)}
.tile.present{background:var(--present);border-color:var(--present);color:var(--present-ink)}
.tile.absent{background:var(--absent);border-color:var(--absent);color:var(--absent-ink)}
.tile.flip{animation:flip .56s ease both;animation-delay:calc(var(--i) * .28s)}
.tile.win{animation:bounce .85s ease both;animation-delay:calc(var(--i) * .09s)}
.row.shake{animation:shake .45s}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
@keyframes bounce{0%,20%{transform:translateY(0)}40%{transform:translateY(-14px)}60%{transform:translateY(3px)}80%{transform:translateY(-6px)}100%{transform:translateY(0)}}

/* tastiera */
#kb{width:100%;display:flex;flex-direction:column;gap:6px;padding:0 2px}
.kr{display:flex;gap:5px;justify-content:center}
.sp{flex:.5}
.key{
  flex:1;max-width:46px;height:54px;border-radius:4px;background:var(--key);color:var(--ink);border:1px solid var(--line);
  font-family:var(--mono);font-weight:600;font-size:clamp(14px,4vw,16px);text-transform:uppercase;
  touch-action:manipulation;transition:background .25s,transform .06s,opacity .25s;
}
.key:hover{background:var(--key-hover)}
.key:active{transform:scale(.95)}
.key.wide{flex:1.55;max-width:70px;font-size:clamp(11px,3vw,13px)}
.key.correct{background:var(--correct);border-color:var(--correct);color:var(--correct-ink)}
.key.present{background:var(--present);border-color:var(--present);color:var(--present-ink)}
.key.absent{background:transparent;border-color:var(--line);color:var(--muted);opacity:.4}
.key svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* avvisi */
#toasts{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:50;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;font-size:14.5px;box-shadow:var(--shadow);animation:in .18s ease-out}
.toast.out{opacity:0;transform:translateY(-6px);transition:.25s}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}

/* finestre */
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:24px 22px 20px;width:min(92vw,400px);max-height:88dvh;overflow:auto;margin:auto;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
dialog[open]{animation:in .18s ease-out}
dialog h2{font-size:20px;font-weight:700;margin-bottom:14px;letter-spacing:-.02em}
dialog p{line-height:1.5;margin-bottom:10px;font-size:15px}
.hint{color:var(--muted);font-size:14px}
.btns{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:12px 14px;border-radius:6px;font-weight:600;font-size:15px;background:transparent;border:1px solid var(--ink);transition:transform .06s,background .15s,color .15s}
.btn:hover{background:var(--key)}
.btn:active{transform:scale(.97)}
.btn.main{background:var(--hud);border-color:var(--hud);color:var(--on-hud)}
.btn.main:hover{opacity:.86;background:var(--hud)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-bottom:18px}
.stats b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.stats span{font-size:12.5px;color:var(--muted)}
.dist{display:grid;grid-template-columns:14px 1fr;gap:5px 8px;align-items:center;font-weight:500;font-size:14px}
.dist .b{background:var(--absent);color:var(--absent-ink);font-family:var(--mono);border-radius:3px;padding:2px 8px;min-width:24px;text-align:right;font-size:13px}
.dist .b.hl{background:var(--correct);color:var(--correct-ink)}
.reveal{margin:0 0 14px;padding:12px 14px;border-radius:6px;background:var(--key);font-size:15px}
.reveal b{font-family:var(--mono);font-size:18px;text-transform:uppercase;letter-spacing:.05em}

.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border-bottom:0}
.opt strong{display:block;font-size:15.5px;font-weight:600}
.opt small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px}
.sw{position:relative;flex:none;width:44px;height:26px}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:26px;background:var(--sw-off);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);transition:transform .2s,background .2s}
.sw input:checked+i{background:var(--hud)}
.sw input:checked+i::after{transform:translateX(18px);background:var(--on-hud)}
.sw input:focus-visible+i{outline:2px solid var(--ink);outline-offset:2px}

/* menu delle modalità */
#menu{flex:1;width:100%;max-width:520px;display:flex;flex-direction:column;padding:10px 20px 28px}
.mtop{display:flex;justify-content:flex-end;gap:2px}
.hero{padding:clamp(18px,6vh,56px) 2px clamp(28px,7vh,60px)}
.logo{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:6px;max-width:calc(var(--cols) * 58px + (var(--cols) - 1) * 6px);margin-inline:auto;container-type:inline-size;--k:.52}
.logo .tile{background:transparent;border-color:var(--wire);color:var(--ink);animation:flip .6s ease both;animation-delay:calc(.25s + var(--i) * .09s)}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:24px 44px 24px 20px;border-radius:6px;background:transparent;
  border:1px solid var(--line);transition:transform .15s,border-color .15s,background .15s}
.mode::after{content:"→";position:absolute;right:18px;top:50%;margin-top:-.6em;font-family:var(--mono);line-height:1.2;color:var(--muted);transition:transform .2s,color .2s}
.mode:hover{border-color:var(--ink);transform:translateY(-2px)}
.mode:hover::after{transform:translateX(4px);color:var(--ink)}
.mode:active{transform:translateY(0) scale(.99)}
.ml strong{display:inline;font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.02em;
  background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;transition:background-size .25s}
.mode:hover .ml strong{background-size:100% 1.5px}
.ml span{display:block;margin-top:5px;font-size:14px;color:var(--muted)}
.mfoot{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.mfoot b{color:var(--ink);font-weight:600}
@media (min-width:640px){#menu{max-width:720px}.modes{display:grid;grid-template-columns:1fr 1fr}}
dialog .msub{margin:-8px 0 14px}
.mode.live{border-color:var(--ink)}
.badge{padding:2px 8px;border-radius:3px;background:var(--hud);color:var(--on-hud);font-weight:600;font-size:12.5px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media (max-height:640px){.key{height:44px}#board{width:min(92vw,calc(var(--cols) * 54px + (var(--cols) - 1) * 6px),calc((100dvh - 262px) * var(--cols) / 6))}}
@media (max-width:400px){.ib{width:38px;height:38px}.ib svg{width:20px;height:20px}}

    <button class="ib" id="bHome" aria-label="Torna al menu"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg></button>
    <button class="ib" id="bStats" aria-label="Statistiche"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></button>
  </div>
  <div class="ttl"><h1>Sburdle</h1><small id="modeTag"></small></div>
  <div class="bar r">
    <button class="ib" id="bNew" aria-label="Nuova parola"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
    <button class="ib" id="bSet" aria-label="Impostazioni"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</header>

<main hidden>
  <div id="board" class="cq" aria-label="Tabellone di gioco" style="--cols:5"></div>
  <div id="kb" aria-label="Tastiera"></div>
</main>

<div id="toasts" aria-live="polite"></div>

<dialog id="dStats">
  <h2>Statistiche</h2>
  <div id="statsBody"></div>
</dialog>

<dialog id="dSet">
  <h2>Impostazioni</h2>
  <label class="opt"><span><strong>Tema scuro</strong></span><span class="sw"><input type="checkbox" id="oDark"><i></i></span></label>
  <label class="opt" hidden><span><strong>Colori per daltonici</strong><small>Arancione e azzurro al posto di verde e giallo.</small></span><span class="sw"><input type="checkbox" id="oHigh"><i></i></span></label>
  <label class="opt"><span><strong>Accetta qualsiasi combinazione</strong><small>Se spento, i tentativi devono essere parole del dizionario del gioco.</small></span><span class="sw"><input type="checkbox" id="oFree"><i></i></span></label>
  <div class="btns"><button class="btn main" data-close>Fatto</button></div>
</dialog>

<script src="parole.js"></script>
<script>
(() => {
  const ROWS = 6;
  let COLS = 5;
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  /* Prima esisteva una sola modalità (5 lettere): sposto i vecchi dati sotto il suffisso .5 */
  ['stats', 'state', 'usate'].forEach(k => {
    const old = store.get('parola.' + k, null);
    if (old !== null && store.get('parola.' + k + '.5', null) === null) store.set('parola.' + k + '.5', old);
    try { localStorage.removeItem('parola.' + k); } catch (e) {}
  });

  let settings = Object.assign({ dark: true, high: false, free: false }, store.get('parola.settings', {}));
  settings.high = false;
  const loadStats = n => Object.assign({ played: 0, won: 0, streak: 0, max: 0, dist: [0, 0, 0, 0, 0, 0] }, store.get('parola.stats.' + n, {}));
  let stats = loadStats(COLS);
  let S = null, busy = false, gen = 0, screen = 'menu';
  let SOL = [], VALIDE = new Set();

  /* ---------- impostazioni ---------- */
  function applySettings() {
    const dark = settings.dark === null ? matchMedia('(prefers-color-scheme: dark)').matches : settings.dark;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.contrast = settings.high ? 'high' : '';
    document.querySelector('meta[name=theme-color]').content = dark ? '#000000' : '#ffffff';
    $('#oDark').checked = dark; $('#oHigh').checked = settings.high; $('#oFree').checked = settings.free;
  }
  $('#oDark').onchange = e => { settings.dark = e.target.checked; store.set('parola.settings', settings); applySettings(); };
  $('#oHigh').onchange = e => { settings.high = e.target.checked; store.set('parola.settings', settings); applySettings(); };
  $('#oFree').onchange = e => { settings.free = e.target.checked; store.set('parola.settings', settings); };

  /* ---------- schermate ---------- */
  function showScreen(s) {
    screen = s;
    document.documentElement.dataset.screen = s;
    if (s !== 'game') document.documentElement.classList.remove('won');
    $('#menu').hidden = s !== 'menu';
    $('header').hidden = s !== 'game';
    $('main').hidden = s !== 'game';
    if (s === 'menu') renderMenu();
    window.scrollTo(0, 0);
  }

  function renderMenu() {
    $('#modes').innerHTML = [4, 5, 6, 7].map(n => {
      const st = loadStats(n), sv = store.get('parola.state.' + n, null);
      const inCorso = sv && !sv.over && sv.guesses && sv.guesses.length > 0;
      const pct = st.played ? Math.round(st.won / st.played * 100) : 0;
      const info = st.played ? `<span><b>${pct}%</b> vinte</span>` : '';
      const badge = inCorso ? `<span class="badge">In corso ${sv.guesses.length}/${ROWS}</span>` : '';
      return `<button class="mode${inCorso ? ' live' : ''}" data-n="${n}" aria-label="${n} lettere${inCorso ? ', partita in corso' : ''}">` +
        `<div class="ml"><strong>${n} lettere</strong></div>` +
        `<div class="mfoot">${info}${badge}</div></button>`;
    }).join('');
  }

  /* ---------- costruzione interfaccia ---------- */
  const board = $('#board');
  function buildBoard() {
    board.innerHTML = '';
    board.style.setProperty('--cols', COLS);
    for (let r = 0; r < ROWS; r++) {
      const row = document.createElement('div'); row.className = 'row';
      for (let c = 0; c < COLS; c++) { const t = document.createElement('div'); t.className = 'tile'; row.appendChild(t); }
      board.appendChild(row);
    }
  }
  const tile = (r, c) => board.children[r].children[c];

  const LAYOUT = ['qwertyuiop', '·asdfghjkl·', 'E zxcvbnm B'];
  const kb = $('#kb'); const keyEls = {};
  const BACK_SVG = '<svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg>';
  LAYOUT.forEach(line => {
    const row = document.createElement('div'); row.className = 'kr';
    [...line].forEach(ch => {
      if (ch === '·') { const s = document.createElement('span'); s.className = 'sp'; row.appendChild(s); return; }
      if (ch === ' ') return;
      const b = document.createElement('button'); b.className = 'key';
      if (ch === 'E') { b.classList.add('wide'); b.textContent = 'Invio'; b.dataset.k = 'ENTER'; b.setAttribute('aria-label', 'Invio'); }
      else if (ch === 'B') { b.classList.add('wide'); b.innerHTML = BACK_SVG; b.dataset.k = 'BACK'; b.setAttribute('aria-label', 'Cancella'); }
      else { b.textContent = ch; b.dataset.k = ch; keyEls[ch] = b; }
      row.appendChild(b);
    });
    kb.appendChild(row);
  });
  kb.addEventListener('click', e => { const b = e.target.closest('.key'); if (b) press(b.dataset.k); });

  /* ---------- logica ---------- */
  function pickWord() {
    const key = 'parola.usate.' + COLS;
    let usate = store.get(key, []);
    let pool = SOL.filter(w => !usate.includes(w));
    if (!pool.length) { usate = []; pool = SOL.slice(); }
    const w = pool[Math.floor(Math.random() * pool.length)];
    usate.push(w); store.set(key, usate);
    return w;
  }
  function evaluate(g, a) {
    const res = Array(COLS).fill('absent'), left = {};
    for (let i = 0; i < COLS; i++) { if (g[i] === a[i]) res[i] = 'correct'; else left[a[i]] = (left[a[i]] || 0) + 1; }
    for (let i = 0; i < COLS; i++) { if (res[i] !== 'correct' && left[g[i]] > 0) { res[i] = 'present'; left[g[i]]--; } }
    return res;
  }
  const save = () => store.set('parola.state.' + COLS, S);

  function paintRow(r, letters) {
    for (let c = 0; c < COLS; c++) {
      const t = tile(r, c), ch = letters[c] || '';
      const had = t.classList.contains('filled');
      t.textContent = ch;
      t.classList.toggle('filled', !!ch);
      if (ch && had) { t.style.animation = 'none'; void t.offsetWidth; t.style.animation = ''; }
    }
  }
  function clearBoard() {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const t = tile(r, c); t.className = 'tile'; t.textContent = ''; t.style.removeProperty('--i'); }
    Object.values(keyEls).forEach(k => k.className = 'key');
    $('#bNew').classList.remove('pulse');
    document.documentElement.classList.remove('won');
  }
  const RANK = { absent: 1, present: 2, correct: 3 };
  function updateKeys() {
    const best = {};
    S.guesses.forEach(g => evaluate(g, S.answer).forEach((s, i) => { if (!best[g[i]] || RANK[s] > RANK[best[g[i]]]) best[g[i]] = s; }));
    for (const [ch, s] of Object.entries(best)) if (keyEls[ch]) keyEls[ch].className = 'key ' + s;
  }

  function newGame() {
    S = { answer: pickWord(), guesses: [], cur: '', over: false, won: false };
    save(); clearBoard(); busy = false;
  }
  function restore() {
    clearBoard();
    S.guesses.forEach((g, r) => { const res = evaluate(g, S.answer); for (let c = 0; c < COLS; c++) { const t = tile(r, c); t.textContent = g[c]; t.classList.add(res[c]); } });
    if (!S.over) paintRow(S.guesses.length, S.cur);
    updateKeys();
    if (S.over) { $('#bNew').classList.add('pulse'); if (!S.won) toast('La parola era ' + S.answer.toUpperCase(), 3500); }
  }

  /* Apre una modalità: riprende la partita in corso, altrimenti ne inizia una nuova */
  /* Legge il dizionario di parole.js in modo tollerante (accetta array o Set, chiavi sol/valide o simili) */
  function getDict(n) {
    let D = null;
    try { D = (typeof DIZIONARIO !== 'undefined') ? DIZIONARIO : (window.DIZIONARIO || window.dizionario || window.PAROLE || null); } catch (e) {}
    if (!D) return { err: 'Dizionario non trovato: controlla che parole.js sia nella stessa cartella e si chiami proprio così' };
    let e = D[n] || D[String(n)];
    if (!e && Array.isArray(D)) e = D.filter(w => typeof w === 'string' && w.length === n);
    if (!e) return { err: 'Nel dizionario mancano le parole da ' + n + ' lettere' };
    const toArr = x => x ? Array.from(x) : [];
    const norm = list => toArr(list).map(w => String(w).trim().toLowerCase()).filter(w => w.length === n && /^[a-z]+$/.test(w));
    const sol = norm(Array.isArray(e) || e instanceof Set ? e : (e.sol || e.soluzioni || e.solutions || e.answers));
    if (!sol.length) return { err: 'Nessuna parola da ' + n + ' lettere trovata in parole.js' };
    const valide = new Set(norm(e.valide || e.valid || e.words || []));
    sol.forEach(w => valide.add(w));
    return { sol, valide };
  }

  function startMode(n) {
    const d = getDict(n);
    if (d.err) { console.error('[Sburdle] ' + d.err); toast(d.err, 5000); return false; }
    gen++;
    COLS = n;
    SOL = d.sol; VALIDE = d.valide;
    stats = loadStats(n);
    S = store.get('parola.state.' + n, null);
    busy = false;
    buildBoard();
    $('#modeTag').textContent = n + ' lettere';
    showScreen('game');
    const riprendi = S && S.answer && S.answer.length === n && Array.isArray(S.guesses) && !S.over && SOL.includes(S.answer);
    if (riprendi) restore(); else newGame();
  }
  function openMode(n) {
    if (startMode(n) === false) return;
    try { history.pushState({ g: 1 }, ''); } catch (e) {}
  }
  function goMenu() {
    if (history.state && history.state.g) history.back(); else showScreen('menu');
  }

  function press(k) {
    if (screen !== 'game' || !S || S.over || busy || document.querySelector('dialog[open]')) return;
    const r = S.guesses.length;
    if (k === 'ENTER') return submit();
    if (k === 'BACK') { S.cur = S.cur.slice(0, -1); }
    else if (/^[a-z]$/.test(k) && S.cur.length < COLS) { S.cur += k; }
    else return;
    paintRow(r, S.cur); save();
  }

  function submit() {
    const r = S.guesses.length, g = S.cur;
    if (g.length < COLS) { shake(r); return toast('Servono ' + COLS + ' lettere'); }
    if (!settings.free && !VALIDE.has(g)) { shake(r); return toast('Questa parola non è nel dizionario'); }
    const res = evaluate(g, S.answer);
    S.guesses.push(g); S.cur = '';
    const won = g === S.answer, lost = !won && S.guesses.length === ROWS;
    if (won || lost) { S.over = true; S.won = won; recordStats(won, S.guesses.length); }
    save(); busy = true;
    const g0 = gen;
    reveal(r, res, () => {
      if (g0 !== gen) return;
      busy = false;
      if (screen !== 'game') return;
      updateKeys();
      if (won) {
        const msgs = ['Geniale!', 'Magnifico!', 'Ottimo!', 'Bravo!', 'Ci sei arrivato!', 'Per un pelo!'];
        toast(msgs[S.guesses.length - 1], 2200);
        document.documentElement.classList.add('won');
        for (let c = 0; c < COLS; c++) { const t = tile(r, c); t.classList.remove('flip'); t.style.setProperty('--i', c); t.classList.add('win'); }
      } else if (lost) toast('La parola era ' + S.answer.toUpperCase(), 4000);
      if (S.over) { $('#bNew').classList.add('pulse'); setTimeout(() => { if (g0 === gen && screen === 'game') openStats(); }, won ? 1800 : 1500); }
    });
  }
  function reveal(r, res, done) {
    for (let c = 0; c < COLS; c++) {
      const t = tile(r, c);
      t.style.setProperty('--i', c); t.classList.add('flip');
      setTimeout(() => t.classList.add(res[c]), c * 280 + 280);
    }
    setTimeout(done, COLS * 280 + 320);
  }
  function shake(r) { const row = board.children[r]; row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); }

  function toast(msg, ms = 1500) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    $('#toasts').prepend(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, ms);
  }

  /* ---------- statistiche (della modalità in corso) ---------- */
  function recordStats(won, n) {
    stats.played++;
    if (won) { stats.won++; stats.streak++; stats.max = Math.max(stats.max, stats.streak); stats.dist[n - 1]++; }
    else stats.streak = 0;
    store.set('parola.stats.' + COLS, stats);
  }
  function shareText() {
    const sym = { correct: settings.high ? '🟧' : '🟩', present: settings.high ? '🟦' : '🟨', absent: '⬛' };
    const lines = S.guesses.map(g => evaluate(g, S.answer).map(s => sym[s]).join(''));
    return `Sburdle ${COLS} lettere: ${S.won ? S.guesses.length : 'X'}/${ROWS}\n\n${lines.join('\n')}\n\n${location.href.split('#')[0]}`;
  }
  function openStats() {
    const pct = stats.played ? Math.round(stats.won / stats.played * 100) : 0;
    const maxd = Math.max(1, ...stats.dist);
    const hl = S && S.over && S.won ? S.guesses.length - 1 : -1;
    let h = `<p class="hint msub">Modalità ${COLS} lettere</p>`;
    h += `<div class="stats"><div><b>${stats.played}</b><span>Giocate</span></div><div><b>${pct}</b><span>% vinte</span></div><div><b>${stats.streak}</b><span>Serie</span></div><div><b>${stats.max}</b><span>Record</span></div></div>`;
    if (S && S.over && !S.won) h += `<div class="reveal">La parola era <b>${S.answer}</b></div>`;
    h += '<div class="dist">' + stats.dist.map((n, i) => `<span>${i + 1}</span><div><div class="b ${i === hl ? 'hl' : ''}" style="width:${Math.max(8, n / maxd * 100)}%">${n}</div></div>`).join('') + '</div>';
    h += '<div class="btns">';
    if (S && S.over) h += '<button class="btn" id="bShare">Condividi</button><button class="btn main" id="bAgain">Nuova parola</button>';
    else h += '<button class="btn main" data-close>Chiudi</button>';
    h += '</div>';
    $('#statsBody').innerHTML = h;
    const sh = $('#bShare'), ag = $('#bAgain');
    if (sh) sh.onclick = async () => {
      const text = shareText();
      try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { return; }
      try { await navigator.clipboard.writeText(text); toast('Risultato copiato'); } catch (e) { toast('Impossibile copiare'); }
    };
    if (ag) ag.onclick = () => { $('#dStats').close(); startNew(); };
    if (!$('#dStats').open) $('#dStats').showModal();
  }
  function startNew() {
    if (S && !S.over && S.guesses.length && !confirm('Abbandonare la partita in corso?')) return;
    newGame();
  }

  /* ---------- eventi ---------- */
  $('#modes').addEventListener('click', e => { const b = e.target.closest('.mode'); if (b) openMode(+b.dataset.n); });
  $('#mSet').onclick = $('#bSet').onclick = () => $('#dSet').showModal();
  $('#bHome').onclick = goMenu;
  $('#bStats').onclick = openStats;
  $('#bNew').onclick = startNew;
  addEventListener('popstate', () => { if (screen === 'game') showScreen('menu'); });
  document.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) e.target.closest('dialog').close();
    if (e.target.tagName === 'DIALOG') {
      const b = e.target.getBoundingClientRect();
      if (e.clientX < b.left || e.clientX > b.right || e.clientY < b.top || e.clientY > b.bottom) e.target.close();
    }
  });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !document.activeElement.classList.contains('key')) return; e.preventDefault(); press('ENTER'); }
    else if (e.key === 'Backspace') press('BACK');
    else if (/^[a-zA-Z]$/.test(e.key)) press(e.key.toLowerCase());
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings);

  /* ---------- avvio: si parte sempre dal menu ---------- */
  try { if (history.state && history.state.g) history.replaceState(null, ''); } catch (e) {}
  applySettings();
  showScreen('menu');
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
</html>
